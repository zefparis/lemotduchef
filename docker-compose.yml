# Le Mot du Chef — stack dédiée. PostgreSQL reste privé (aucun port publié) ;
# l'API n'est exposée que sur 127.0.0.1:${API_PORT} pour cloudflared (tunnel sur l'hôte).
services:
  db:
    image: postgres:17-alpine
    container_name: lemotduchef-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lemotduchef}
      POSTGRES_USER: ${POSTGRES_USER:-lemotduchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemotduchef} -d ${POSTGRES_DB:-lemotduchef}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: lemotduchef-api
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-lemotduchef}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lemotduchef}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?définir dans .env}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:3500}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      # Back-office /admin : liste d'emails séparés par des virgules.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-30}
      RATE_LIMIT_GENERATE_MAX: ${RATE_LIMIT_GENERATE_MAX:-20}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Emails transactionnels (vérification, reset) — requis pour l'inscription.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Le Mot du Chef <noreply@localhost>}
      # Origine du frontend pour les liens envoyés par email.
      FRONT_URL: ${FRONT_URL:-}
      # Rédacteur LLM (appels côté serveur uniquement).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-40000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      # Offres : quota mensuel Gratuit et profondeur d'historique.
      FREE_MONTHLY_REPLIES: ${FREE_MONTHLY_REPLIES:-5}
      FREE_HISTORY_DAYS: ${FREE_HISTORY_DAYS:-30}
      # RGPD : purge du texte des avis et du prénom d'auteur (mois, 0 = jamais).
      REVIEW_RETENTION_MONTHS: ${REVIEW_RETENTION_MONTHS:-12}
      # Notifications Web Push — générer : npx web-push generate-vapid-keys.
      # Vides = fonctionnalité dormante proprement.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@lemotduchef.fr}
      # Ingestion des avis par email (transfert Google → avis+code@) — OFF par
      # défaut, à activer explicitement quand le parsing est validé.
      MAIL_INGEST_ENABLED: ${MAIL_INGEST_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-imap.mail.ovh.net}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_TLS: ${IMAP_TLS:-true}
      IMAP_POLL_INTERVAL_SEC: ${IMAP_POLL_INTERVAL_SEC:-120}
      IMAP_PROCESSED_FOLDER: ${IMAP_PROCESSED_FOLDER:-}
      REVIEW_MAIL_ADDRESS: ${REVIEW_MAIL_ADDRESS:-avis@lemotduchef.fr}
      REVIEW_MAIL_CODE_LENGTH: ${REVIEW_MAIL_CODE_LENGTH:-8}
      # Abonnement Stripe (Checkout + Portail + webhook signé).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      # Marché ZA (cf. public/markets.js) : za.lemotduchef.fr — même API et
      # mêmes boîtes email que FR ; ZA_DOMAINS = domaines supplémentaires.
      ZA_DOMAINS: ${ZA_DOMAINS:-}
      PAYSTACK_ZA_SECRET_KEY: ${PAYSTACK_ZA_SECRET_KEY:-}
      PAYSTACK_ZA_PUBLIC_KEY: ${PAYSTACK_ZA_PUBLIC_KEY:-}
      PAYSTACK_ZA_PLAN_MONTHLY: ${PAYSTACK_ZA_PLAN_MONTHLY:-}
      PAYSTACK_ZA_PLAN_YEARLY: ${PAYSTACK_ZA_PLAN_YEARLY:-}
      STRIPE_ZA_SECRET_KEY: ${STRIPE_ZA_SECRET_KEY:-}
      STRIPE_ZA_WEBHOOK_SECRET: ${STRIPE_ZA_WEBHOOK_SECRET:-}
      STRIPE_ZA_PRICE_PRO_MONTHLY: ${STRIPE_ZA_PRICE_PRO_MONTHLY:-}
      STRIPE_ZA_PRICE_PRO_YEARLY: ${STRIPE_ZA_PRICE_PRO_YEARLY:-}
      STRIPE_KE_PRICE_PRO_MONTHLY: ${STRIPE_KE_PRICE_PRO_MONTHLY:-}
      STRIPE_KE_PRICE_PRO_YEARLY: ${STRIPE_KE_PRICE_PRO_YEARLY:-}
      STRIPE_CD_PRICE_PRO_MONTHLY: ${STRIPE_CD_PRICE_PRO_MONTHLY:-}
      STRIPE_CD_PRICE_PRO_YEARLY: ${STRIPE_CD_PRICE_PRO_YEARLY:-}
    ports:
      # Loopback uniquement : le tunnel cloudflared tourne sur l'hôte X3.
      - "127.0.0.1:${API_PORT:-3500}:3500"
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3500/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  app:
    name: lemotduchef-net
    driver: bridge

volumes:
  pgdata:
    name: lemotduchef-pgdata
